<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="100%" height="100%">
  <defs>
    <style>
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .window { fill: #0c0c0c; stroke: #333333; stroke-width: 1; rx: 6px; }
      .titlebar { fill: #ffffff; rx: 6px; }
      .title-text { fill: #000000; font-family: "Segoe UI", Tahoma, sans-serif; font-size: 12px; }
      .win-btn { fill: #000000; font-family: "Segoe UI", sans-serif; font-size: 11px; text-anchor: middle; }
      
      .font { font-family: "Consolas", "Lucida Console", "Courier New", monospace; font-size: 13.5px; }
      .sys { fill: #888888; }
      .prompt { fill: #cccccc; }
      .cmd { fill: #ffffff; font-weight: bold; }
      .label { fill: #3b78ff; font-weight: bold; }
      .val { fill: #cccccc; }
      .green { fill: #16c60c; }
      .link { fill: #61d6d6; }

      .step-1 { animation: fadeIn 0.4s ease-in forwards; opacity: 0; }
      .step-2 { animation: fadeIn 0.4s ease-in 0.5s forwards; opacity: 0; }
      .step-3 { animation: fadeIn 0.4s ease-in 1.0s forwards; opacity: 0; }
      .step-4 { animation: fadeIn 0.4s ease-in 1.5s forwards; opacity: 0; }
      .step-5 { animation: fadeIn 0.4s ease-in 2.0s forwards; opacity: 0; }
      .cursor { fill: #cccccc; animation: blink 1s infinite; }
    </style>
  </defs>

  <rect width="838" height="468" x="1" y="1" class="window" />

